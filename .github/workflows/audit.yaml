name: audit

# 既知の脆弱性の門。中身は package.json の `audit` (= `check` の先頭) と同じもの。
# 勧告は PR と無関係に公開されるので、PR と push に加えて毎日も走らせる。
# schedule と workflow_dispatch は default branch (main) に在る workflow でしか動かない。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # install しない。pnpm audit は lockfile を読む。pnpm 11 は node_modules が無いと
      # `pnpm run` の前に依存を入れる (verifyDepsBeforeRun の既定)。env の 1 行がそれを止める。
      - name: Audit the lockfile
        run: pnpm run audit
        env:
          pnpm_config_verify_deps_before_run: "false"
