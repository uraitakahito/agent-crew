# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot が読むのは default branch (main) に置かれたこのファイルだけ。
# ecosystem は pnpm でも `npm`（pnpm-lock.yaml をこの ecosystem で扱う）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 版が枯れてから PR にする (supply-chain 対策)。security 更新には効かない。
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
    ignore:
      # typescript-eslint の peer が `typescript <6.1.0` の間は、TS 7 に上げると lint が必ず落ちる。
      # 対応版が出たら消す。確かめ方: npm view typescript-eslint@latest peerDependencies.typescript
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
